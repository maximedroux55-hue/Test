name: Swiss DeepTech news digest

# Two ways to run:
#  1. Manually: Actions tab -> "Swiss DeepTech news digest" -> "Run workflow".
#  2. Automatically: every Monday morning (for the weekly roundup).
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look"
        default: "7"
      min_score:
        description: "Minimum relevance score"
        default: "4"
      limit:
        description: "Maximum number of stories"
        default: "25"
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC (about 08:00 in Switzerland)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r deeptech-news/requirements.txt

      - name: Build the digest
        env:
          # Optional: add a repo secret named ANTHROPIC_API_KEY to get
          # AI-written LinkedIn posts. Without it, template drafts are used.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd deeptech-news
          python scraper.py \
            --days "${{ github.event.inputs.days || '7' }}" \
            --min-score "${{ github.event.inputs.min_score || '4' }}" \
            --limit "${{ github.event.inputs.limit || '25' }}"

      - name: Upload digest (Markdown + HTML)
        uses: actions/upload-artifact@v4
        with:
          name: swiss-deeptech-digest
          path: deeptech-news/output/
