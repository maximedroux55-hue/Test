name: Swiss DeepTech news digest

# Two ways to run:
#  1. Manually: Actions tab -> "Swiss DeepTech news digest" -> "Run workflow".
#  2. Automatically: every Wednesday morning, producing 7 posts for the week
#     so they can all be scheduled in one session.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look"
        default: "10"
      min_score:
        description: "Minimum relevance score"
        default: "4"
      limit:
        description: "Maximum number of stories to consider"
        default: "25"
      posts:
        description: "Number of LinkedIn posts to write (one per day)"
        default: "7"
  schedule:
    # 06:00 UTC every Wednesday (about 08:00 in Switzerland).
    - cron: "0 6 * * 3"

permissions:
  contents: write

# Never let two runs publish at the same time. A second trigger waits for the
# first to finish instead of racing it on the git push.
concurrency:
  group: news-digest-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r deeptech-news/requirements.txt

      - name: Build the digest
        env:
          # Optional: add a repo secret named ANTHROPIC_API_KEY to get
          # AI-written LinkedIn posts. Without it, template drafts are used.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd deeptech-news
          python scraper.py \
            --days "${{ github.event.inputs.days || '10' }}" \
            --min-score "${{ github.event.inputs.min_score || '4' }}" \
            --limit "${{ github.event.inputs.limit || '25' }}" \
            --posts "${{ github.event.inputs.posts || '7' }}"

      - name: Upload digest (Markdown + HTML)
        uses: actions/upload-artifact@v4
        with:
          name: swiss-deeptech-digest
          path: deeptech-news/output/

      # Publish the latest digest into the repo at stable filenames so it can be
      # read (and copied) straight from github.com on a phone, no download needed.
      - name: Publish latest digest to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # history.json and archive.json are written straight into digest/ by
          # the scraper and are cumulative, so keep a copy before any reset.
          mkdir -p /tmp/carry
          cp digest/history.json /tmp/carry/ 2>/dev/null || true
          cp digest/archive.json /tmp/carry/ 2>/dev/null || true

          # These files are regenerated in full every run, so rebasing one run
          # onto another only produces conflicts in generated content. Take the
          # remote state, lay this run's output on top, and push that.
          for attempt in 1 2 3 4 5; do
            git fetch origin ${GITHUB_REF_NAME}
            git reset --hard origin/${GITHUB_REF_NAME}

            mkdir -p digest plan
            cp deeptech-news/output/linkedin-*.md digest/linkedin.md
            cp deeptech-news/output/digest-*.md   digest/news.md
            cp deeptech-news/output/digest-*.html digest/index.html
            cp deeptech-news/output/posts.json    digest/posts.json
            cp deeptech-news/output/archive.html  digest/archive.html
            cp /tmp/carry/history.json digest/history.json 2>/dev/null || true
            cp /tmp/carry/archive.json digest/archive.json 2>/dev/null || true
            # The phone-friendly weekly plan, served at maxime-droux.com/plan
            cp deeptech-news/output/plan.html     plan/index.html

            git add digest plan
            git commit -m "Update latest digest" || { echo "No changes to publish."; exit 0; }
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "Published."; exit 0
            fi
            echo "Push rejected (attempt $attempt); taking the latest and retrying."
            sleep $((attempt * 3))
          done
          echo "Could not publish after retries."; exit 1
