name: Swiss DeepTech news digest

# The weekly LinkedIn posts. This is one of two independent jobs reading the
# same feeds; the deal database is deal-archive.yml and runs on its own. Neither
# writes the other's files, so a bad week here cannot damage the database and a
# broken lookup there cannot cost you the week's posts.
#
# Two ways to run:
#  1. Manually: the button on maxime-droux.com, or Actions -> Run workflow.
#  2. Automatically: every Wednesday morning, producing a shortlist of 15
#     stories, newest published first, to pick from.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look"
        # Ten days is the ceiling. A post about a three week old round is not
        # news, so a short week is the better trade: the cap and the window
        # both stand and the week is however long the news made it.
        default: "10"
      min_score:
        # Three, not four. Four was tuned when the list was seven funding
        # rounds; a discovery carries no deal words and so scores lower than a
        # round of the same importance. Appointments, listicles, market reports
        # and court news are held out by the noise rules, not by this number.
        description: "Minimum relevance score"
        default: "3"
      limit:
        description: "Maximum number of stories to consider"
        default: "90"
      posts:
        description: "Length of the shortlist to draft"
        default: "15"
      force:
        description: "Rebuild even if the shortlist on disk is still current"
        default: "false"
  schedule:
    # 05:41 UTC every Wednesday, so the week's plan is on the page by about
    # 08:00 in Switzerland rather than starting then. Off the hour on purpose:
    # GitHub's scheduled-run queue is at its worst at round hours.
    - cron: "41 5 * * 3"

permissions:
  contents: write

# Never let two runs publish at the same time. A second trigger waits for the
# first to finish instead of racing it on the git push.
concurrency:
  group: news-digest-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r deeptech-news/requirements.txt

      # A change that breaks a known case must not reach the page.
      - name: Run the regression tests
        run: |
          cd deeptech-news
          python tests/test_regressions.py

      - name: Build the shortlist
        env:
          # Optional: add a repo secret named ANTHROPIC_API_KEY to get
          # AI-written LinkedIn posts. Without it, template drafts are used.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd deeptech-news
          python scraper.py \
            --days "${{ github.event.inputs.days || '10' }}" \
            --min-score "${{ github.event.inputs.min_score || '3' }}" \
            --limit "${{ github.event.inputs.limit || '90' }}" \
            --posts "${{ github.event.inputs.posts || '15' }}" \
            ${{ github.event.inputs.force != 'true' && '--skip-if-week-planned' || '' }} \
            --posts-only

      - name: Upload digest (Markdown + HTML)
        uses: actions/upload-artifact@v4
        with:
          name: swiss-deeptech-digest
          path: deeptech-news/output/

      # Publish the latest digest into the repo at stable filenames so it can be
      # read (and copied) straight from github.com on a phone, no download needed.
      # Only the post files are touched here. digest/archive.json and
      # digest/archive.html belong to the database job and are left alone.
      - name: Publish the posts to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # history.json is written straight into digest/ by the scraper and is
          # cumulative, so keep a copy before any reset.
          mkdir -p /tmp/carry
          cp digest/history.json /tmp/carry/ 2>/dev/null || true

          # These files are regenerated in full every run, so rebasing one run
          # onto another only produces conflicts in generated content. Take the
          # remote state, lay this run's output on top, and push that.
          for attempt in 1 2 3 4 5; do
            git fetch origin ${GITHUB_REF_NAME}
            git reset --hard origin/${GITHUB_REF_NAME}

            mkdir -p digest plan
            cp deeptech-news/output/linkedin-*.md digest/linkedin.md
            # digest/index.html and digest/news.md belong to the daily database
            # job, so they refresh every morning rather than once a week. Two
            # jobs writing one file is the thing this split exists to avoid.
            cp deeptech-news/output/posts.json    digest/posts.json
            cp /tmp/carry/history.json digest/history.json 2>/dev/null || true
            # The phone-friendly weekly plan, served at maxime-droux.com/plan
            cp deeptech-news/output/plan.html     plan/index.html

            git add digest plan
            git commit -m "Update the week's posts" || { echo "No changes to publish."; exit 0; }
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "Published."; exit 0
            fi
            echo "Push rejected (attempt $attempt); taking the latest and retrying."
            sleep $((attempt * 3))
          done
          echo "Could not publish after retries."; exit 1

      # The posts are published either way, but a run that could not reach the
      # API produced template drafts rather than posts in Max's voice, which is
      # worth an email rather than a green tick.
      - name: Fail if the AI was unavailable
        if: always()
        run: |
          if [ -f deeptech-news/output/AI_UNAVAILABLE ]; then
            cat deeptech-news/output/AI_UNAVAILABLE
            echo "::error::$(head -1 deeptech-news/output/AI_UNAVAILABLE)"
            exit 1
          fi
